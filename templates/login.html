<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="main-container">

    <div class="form-card">

        <div class="login-icon">
            🔐
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue exploring nearby services.
        </p>

        <form id="loginForm">

   <div class="input-group">

    <span class="input-icon">📧</span>

    <input
        type="email"
        name="email"
        id="email"
        placeholder="Email Address"
        required>

</div>

<div class="input-group">

    <span class="input-icon">🔒</span>

    <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        required>

    <span id="togglePassword" class="eye">

        👁️

    </span>

</div>
    <button type="submit">

    🔓 Sign In

</button>

</form>


<div id="otpModal" class="otp-modal">

    <div class="otp-box">

        <h2>📧 Verify Login OTP</h2>

        <p class="otp-text">
    OTP sent to your registered email
</p>

<p class="otp-email">
    <span id="otpEmail"></span>
</p>

        <input
        type="number"
        id="otp"
        maxlength="6"
        placeholder="Enter 6-digit OTP">

        <button id="verifyBtn">

            Verify OTP

        </button>

        <p id="timer">

            Resend OTP (30)

        </p>

    </div>

</div>

        <a href="/register" class="link">

            Don't have an account? Register

        </a>

        <a href="/" class="link">

            ← Back to Home

        </a>

    </div>

</div>

<script>

const form=document.getElementById("loginForm");

form.addEventListener("submit",function(e){

e.preventDefault();

const formData=new FormData(form);

fetch("/login",{

method:"POST",

body:formData

})

.then(res=>res.json())

.then(data=>{

if(data.status=="success"){
    document.getElementById("otp").value="";

document.getElementById("otpModal").style.display="flex";

document.getElementById("otpEmail").innerText=data.email;

}

else{

alert(data.message);

}

});

});

</script>
<script>

document.getElementById("verifyBtn").addEventListener("click", function () {

    const formData = new FormData();

    formData.append(
        "otp",
        document.getElementById("otp").value
    );

    fetch("/verify-login-otp", {
        method: "POST",
        body: formData
    })

    .then(res => res.json())

    .then(data => {

        if (data.status == "success") {

            window.location = "/dashboard";

        } else {

            alert(data.message);

        }

    });

});

</script>

<script>

const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.onclick = function () {

    if (password.type === "password") {

        password.type = "text";
        toggle.innerHTML = "🙈";

    } else {

        password.type = "password";
        toggle.innerHTML = "👁️";

    }

}

</script>

</body>

</html>
