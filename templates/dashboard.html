<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="main-container">

<div class="dashboard-container">

    <!-- Welcome -->

    <div class="welcome-card">

        <h1>👋 Welcome, {{ name }}</h1>

        <p>

            Ready to explore nearby services?

        </p>

    </div>

    <!-- Cards -->

    <div class="dashboard-grid">

        <div class="dashboard-card">

            <h2>🌍 Find Nearby</h2>

            <p>

                Search nearby hospitals,
                restaurants, shopping malls and more.

            </p>

            <a href="/nearby" class="btn">

                Open

            </a>

        </div>

        <div class="dashboard-card">

            <h2>👤 My Account</h2>

            <p>

                Logged in as

                <b>{{ name }}</b>

            </p>

            <button disabled>

                User

            </button>

        </div>

    </div>

    <!-- Features -->

    <div class="feature-box">

        <h2>🚀 Available Services</h2>

        <div class="feature-grid">

            <div>🏥 Hospital</div>

            <div>🍽 Restaurant</div>

            <div>🏧 Mall</div>

            <div>💊 Pharmacy</div>

            <div>⛽ Petrol Pump</div>

        </div>

    </div>

    <a href="/logout" class="btn logout-dashboard">

        🚪 Logout

    </a>

</div>

</div>

</body>

</html>
